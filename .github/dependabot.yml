version: 2
updates:
  # Enable version updates for npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
    # pnpm 11 enforces minimumReleaseAge (24h) on frozen lockfile installs in CI.
    # Delay version-update PRs so published packages pass that check.
    cooldown:
      default-days: 2
      semver-patch-days: 2
      semver-minor-days: 2
      semver-major-days: 7
    groups:
      app-and-tooling:
        patterns:
          - "astro"
          - "@astrojs/*"
          - "react"
          - "lucide-react"
          - "typescript-eslint"
          - "typescript"
          - "postcss"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
    assignees:
      - "dytsou"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
    assignees:
      - "dytsou"
