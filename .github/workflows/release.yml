name: Release

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: GitHub Release from package.json
        uses: dytsou/release/github@291dd276baf77a9770947c5b4149e6fc866b8120 # v1.3.5 (@v1)
        with:
          from-package-json: "true"
          move-major-tag: "false"
