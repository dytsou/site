name: Release

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: GitHub Release from package.json
        uses: dytsou/release/github@98055479dc1f0015d278ecd26b54ec6897d85eed # v1.3.5 (@v1)
        with:
          from-package-json: "true"
          move-major-tag: "false"
