name: Release

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: GitHub Release from package.json
        uses: dytsou/release/github@f4ac7961c8c67fc6887ce2265a19d01929960ce5 # v1.3.5 (@v1)
        with:
          from-package-json: "true"
          move-major-tag: "false"
