name: Release

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: GitHub Release from package.json
        uses: dytsou/release/github@90a5d86a19d975ad98a049bd52828307f40710c2 # v1.1.0 (@v1)
        with:
          from-package-json: "true"
          move-major-tag: "false"
