name: Sync Projects

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync-projects:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync project data
        run: pnpm sync:projects
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ github.token }}
          commit-message: "chore: sync generated project data"
          branch: automation/sync-projects
          delete-branch: true
          title: "chore: sync generated project data"
          body: |
            ## Summary
            - refresh generated project metadata from GitHub
            - keep the projects carousel in sync with the configured repository URLs

            ## Test plan
            - [x] `pnpm sync:projects`
          add-paths: |
            src/components/contents/projects.sources.json
            src/components/contents/Projects.generated.ts
