name: Deploy to Cloudflare Pages

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CLOUDFLARE_PAGES_PROJECT_NAME: dy-tsou-me

jobs:
  checks:
    # Run checks for manual workflow_dispatch (CI already ran for workflow_run)
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format

      - name: Run linter
        run: pnpm lint

      - name: Run type check
        run: pnpm typecheck

      - name: Build site
        run: pnpm build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  deploy:
    # Only deploy if:
    # - CI (.github/workflows/ci.yml, workflow name "CI") completed successfully (workflow_run), OR
    # - checks job completed successfully (manual workflow_dispatch)
    needs: [checks]
    if: |
      always() &&
      (
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
        (github.event_name == 'workflow_dispatch' && needs.checks.result == 'success')
      )
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download build artifact from CI
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download build artifact from checks
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist

      - name: Restore agent discovery in dist
        run: |
          if [ ! -f dist/.well-known/oauth-authorization-server ]; then
            echo "dist/.well-known missing from artifact; regenerating"
            node scripts/emit-agent-discovery.mjs
            cp -R public/.well-known dist/
            cp public/auth.md dist/
          fi

      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "::error::dist folder not found after download"
            exit 1
          fi
          node scripts/verify-agent-discovery.mjs --local
          echo "✓ Build output verified"
          ls -la dist/.well-known/ | head -20

      - name: Deploy Pages and register front-door routes
        uses: dytsou/cloudflare-subpath-deploy@1d47dbb638f9855ea97bdc302a1eafb0606a68ac # v1.0.0 (@v1)
        with:
          output-dir: dist
          manifest-repo: dytsou/site
          # Site owns the manifest (maintained in-repo via PR) and the Worker
          # bundles the committed copy at deploy time, so skip the circular
          # self-upsert that would push to protected main.
          register-route: "false"
          deploy-worker: "true"
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          manifest-repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync bare-mount zone redirects
        run: node scripts/sync-bare-mount-redirects.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          SITE_URL: https://dy.tsou.me

      - name: Purge front-door edge cache
        run: node scripts/purge-front-door-cache.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          SITE_URL: https://dy.tsou.me

      - name: Verify Markdown for Agents
        run: node scripts/verify-markdown-negotiation.mjs
        env:
          SITE_URL: https://dy.tsou.me/

      - name: Verify agent discovery endpoints
        run: node scripts/verify-agent-discovery.mjs
        env:
          SITE_URL: https://dy.tsou.me
