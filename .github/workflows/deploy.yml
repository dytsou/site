name: Deploy to Cloudflare Pages

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CLOUDFLARE_PAGES_PROJECT_NAME: dy-tsou-me

jobs:
  checks:
    # Run checks for manual workflow_dispatch (CI already ran for workflow_run)
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format

      - name: Run linter
        run: pnpm lint

      - name: Run type check
        run: pnpm typecheck

      - name: Build site
        run: pnpm build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  deploy:
    # Only deploy if:
    # - CI (.github/workflows/ci.yml, workflow name "CI") completed successfully (workflow_run), OR
    # - checks job completed successfully (manual workflow_dispatch)
    needs: [checks]
    if: |
      always() &&
      (
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
        (github.event_name == 'workflow_dispatch' && needs.checks.result == 'success')
      )
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Download build artifact from CI
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download build artifact from checks
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Restore agent discovery in dist
        run: |
          if [ ! -f dist/.well-known/oauth-authorization-server ]; then
            echo "dist/.well-known missing from artifact; regenerating"
            node scripts/emit-agent-discovery.mjs
            cp -R public/.well-known dist/
            cp public/auth.md dist/
          fi

      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "::error::dist folder not found after download"
            exit 1
          fi
          node scripts/verify-agent-discovery.mjs --local
          echo "✓ Build output verified"
          ls -la dist/.well-known/ | head -20

      - name: Verify Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 1
          fi
          echo "✓ Cloudflare credentials are configured"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Attach custom domain to Cloudflare Pages
        continue-on-error: true
        run: node infra/attach-pages-domain.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ env.CLOUDFLARE_PAGES_PROJECT_NAME }}

      - name: Point custom domain DNS to Cloudflare Pages
        continue-on-error: true
        run: node infra/update-pages-dns.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}

      - name: Enable zone Markdown for Agents
        continue-on-error: true
        run: node infra/enable-markdown-for-agents.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT_NAME }}
          packageManager: npm
          wranglerVersion: "4"

      - name: Verify Markdown for Agents
        run: node scripts/verify-markdown-negotiation.mjs
        env:
          SITE_URL: https://dy.tsou.me/

      - name: Verify agent discovery endpoints
        run: node scripts/verify-agent-discovery.mjs
        env:
          SITE_URL: https://dy.tsou.me
