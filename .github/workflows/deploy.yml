name: Deploy to dytsou.github.io

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  checks:
    # Run checks for manual workflow_dispatch (CI already ran for workflow_run)
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format

      - name: Run linter
        run: pnpm lint

      - name: Run type check
        run: pnpm typecheck

      - name: Build site
        run: pnpm build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1
          if-no-files-found: error

  deploy:
    # Only deploy if:
    # - CI (.github/workflows/ci.yml, workflow name "CI") completed successfully (workflow_run), OR
    # - checks job completed successfully (manual workflow_dispatch)
    needs: [checks]
    if: |
      always() &&
      (
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
        (github.event_name == 'workflow_dispatch' && needs.checks.result == 'success')
      )
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - name: Download build artifact from CI
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download build artifact from checks
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "::error::dist folder not found after download"
            exit 1
          fi
          echo "✓ Build output verified"
          ls -la dist/ | head -20

      - name: Verify deployment token
        run: |
          if [ -z "$GH_PAGES_TOKEN" ]; then
            echo "::error::GH_PAGES_TOKEN secret is not set. Please create a Personal Access Token (PAT) with 'repo' scope and add it as a secret named 'GH_PAGES_TOKEN' in your repository settings."
            exit 1
          fi
          echo "✓ Deployment token is configured"
        env:
          GH_PAGES_TOKEN: ${{ secrets.GH_PAGES_TOKEN }}

      - name: Deploy to dytsou.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GH_PAGES_TOKEN }}
          external_repository: dytsou/dytsou.github.io
          publish_dir: ./dist
          publish_branch: main
          user_name: dytsou
          user_email: d.y.tsou@gmail.com
          keep_files: true
          cname: dy.tsou.me
