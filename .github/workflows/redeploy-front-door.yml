name: Redeploy Front Door

on:
  push:
    branches: [main]
    paths:
      - src/data/route-manifest.json
      - workers/front-door/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Checkout Action lib
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: dytsou/cloudflare-subpath-deploy
          ref: 1d47dbb638f9855ea97bdc302a1eafb0606a68ac # v1.0.0 (@v1)
          path: action-lib

      - name: Validate route manifest
        run: node scripts/verify-route-manifest.mjs

      - name: Validate front-door routing
        run: node scripts/verify-front-door-routing.mjs

      - name: Deploy front-door Worker
        run: node action-lib/lib/deploy-worker.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Sync bare-mount zone redirects
        run: node scripts/sync-bare-mount-redirects.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          SITE_URL: https://dy.tsou.me

      - name: Purge front-door edge cache
        run: node scripts/purge-front-door-cache.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          SITE_URL: https://dy.tsou.me

      # Canonical smoke is a real gate: it fails on 5xx/404/empty body but
      # skips on 403 (Cloudflare challenges CI IPs), so no continue-on-error.
      - name: Smoke canonical routes
        run: node action-lib/lib/smoke-routes.mjs --canonical
        env:
          SITE_URL: https://dy.tsou.me
