allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
# Supply-chain settings for pnpm 11+. See https://pnpm.io/settings#minimumreleaseage
minimumReleaseAge: 1440
overrides:
  esbuild: '>=0.28.1'
  fast-uri: '>=4.1.4'
  js-yaml: '>=4.3.1 <5'
  nanoid: '>=3.3.17 <4'
  undici: '>=7.29.0'
  svgo: '>=4.0.2'
  brace-expansion: '>=5.0.6'
  sharp: '>=0.35.4'
  # 0.1.2 and 0.1.3 pin @emnapi/core@1.11.3 and leave @emnapi/runtime as a peer.
  # Rolldown's wasm binding then satisfies that peer with 2.0.0-beta.2, and
  # `astro check` crashes (`setLastError is not a function`). 0.1.4 depends
  # on runtime 1.11.3.
  '@astrojs/astro2tsx': '>=0.1.4'
